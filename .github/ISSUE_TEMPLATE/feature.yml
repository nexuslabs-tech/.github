name: Feature request
description: Propose an evidence-based improvement to a Nexus Labs project
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Start with the problem and desired outcome. Implementation ideas are
        useful, but they should not replace a clear statement of need.

  - type: input
    id: repository
    attributes:
      label: Repository or component
      description: Which repository, service, package, or component would own this change?
      placeholder: nexus / engineering-harness / component-name
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: What limitation, repeated cost, or unmet need should be addressed?
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe observable success without prescribing an implementation.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence and context
      description: Add examples, measurements, prior incidents, references, or constraints.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: Optional implementation or design proposal.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What other approaches or workarounds were evaluated?

  - type: textarea
    id: scope
    attributes:
      label: Scope, risks, and dependencies
      description: Identify affected systems, compatibility concerns, and external dependencies.

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing issues, pull requests, and documentation.
          required: true
        - label: I described the problem and observable outcome separately from the implementation.
          required: true
        - label: I removed secrets, credentials, and personal data from the request.
          required: true
