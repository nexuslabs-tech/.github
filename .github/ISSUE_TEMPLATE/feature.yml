name: Propuesta de funcionalidad
description: Proponé una mejora basada en evidencia para un proyecto de Nexus Labs
title: "[Propuesta]: "
body:
  - type: markdown
    attributes:
      value: |
        Comenzá por el problema y el resultado deseado. Las ideas de
        implementación son útiles, pero no deben reemplazar una necesidad clara.

  - type: input
    id: repository
    attributes:
      label: Repositorio o componente
      description: ¿Qué repositorio, servicio, paquete o componente sería responsable del cambio?
      placeholder: nexus / arnes-de-ingenieria / nombre-del-componente
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problema u oportunidad
      description: ¿Qué limitación, costo repetido o necesidad sin resolver debe abordarse?
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Resultado deseado
      description: Describí un resultado observable sin imponer una implementación.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidencia y contexto
      description: Agregá ejemplos, mediciones, incidentes anteriores, referencias o restricciones.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Enfoque propuesto
      description: Propuesta opcional de implementación o diseño.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternativas consideradas
      description: ¿Qué otros enfoques o soluciones temporales se evaluaron?

  - type: textarea
    id: scope
    attributes:
      label: Alcance, riesgos y dependencias
      description: Identificá los sistemas afectados, la compatibilidad y las dependencias externas.

  - type: checkboxes
    id: checks
    attributes:
      label: Verificaciones previas
      options:
        - label: Busqué en las incidencias, solicitudes de cambios y documentación existentes.
          required: true
        - label: Describí el problema y el resultado observable por separado de la implementación.
          required: true
        - label: Eliminé secretos, credenciales y datos personales de la propuesta.
          required: true
