name: Informe de error
description: Informá un problema reproducible en un proyecto de Nexus Labs
title: "[Error]: "
body:
  - type: markdown
    attributes:
      value: |
        Gracias por informar un problema. No incluyas credenciales, datos
        personales ni detalles de vulnerabilidades. Utilizá el proceso privado
        de seguridad para los informes sensibles.

  - type: input
    id: repository
    attributes:
      label: Repositorio o componente
      description: ¿Qué repositorio, servicio, paquete o componente está afectado?
      placeholder: nexus / cloud-gateway / nombre-del-paquete
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problema
      description: Describí el comportamiento observado y su impacto.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Pasos de reproducción
      description: Indicá la secuencia determinista más corta que reproduce el problema.
      placeholder: |
        1. Configurá...
        2. Ejecutá...
        3. Observá...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Comportamiento esperado
      description: ¿Qué debería haber ocurrido?
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Entorno
      description: Incluí el sistema operativo, entorno de ejecución, versión, confirmación y despliegue relevantes.
      render: text
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidencia
      description: Agregá registros depurados, trazas, capturas, pruebas fallidas o enlaces a confirmaciones.

  - type: dropdown
    id: regression
    attributes:
      label: Regresión
      description: ¿Funcionaba correctamente antes?
      options:
        - No se sabe
        - Sí
        - No
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Verificaciones previas
      options:
        - label: Busqué este problema en las incidencias y solicitudes de cambios existentes.
          required: true
        - label: Eliminé secretos, credenciales y datos personales del informe.
          required: true
        - label: Esto no es una divulgación pública de una vulnerabilidad de seguridad.
          required: true
